<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Achievement Lock - E-Book Flipbook | Denny's Bunch</title>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
  :root{
    --gold:#e8c400;
    --bg-dark:#111317;
    --panel-dark:#1a1d24;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:radial-gradient(circle at 50% 20%, #23262f 0%, #111317 70%);
    font-family:'Segoe UI', Arial, sans-serif;
    color:#eee;
    overflow:hidden;
  }
  #stage{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:14px;
    padding:16px;
  }
  #title-bar{
    font-size:14px;
    letter-spacing:2px;
    color:var(--gold);
    text-transform:uppercase;
    font-weight:600;
    opacity:.85;
    text-align:center;
  }
  #book-wrap{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    max-width:900px;
    margin:0 auto;
    flex:1;
    min-height:0;
    padding:28px 24px;
    box-sizing:border-box;
    overflow:visible;
  }
  #bookshadow{
    position:absolute;
    width:min(92vw, calc(68vh * 1.41), 900px);
    height:min(68vh, calc(92vw / 1.41), calc(900px / 1.41));
    border-radius:6px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
    pointer-events:none;
    z-index:0;
    margin:0 auto;
  }
  #book{
    position:relative;
    z-index:1;
    width:min(92vw, calc(68vh * 1.41), 900px);
    height:min(68vh, calc(92vw / 1.41), calc(900px / 1.41));
    background-color:transparent;
    overflow:hidden;
    margin:0 auto;
  }
  /* Permanent center spine shadow — simulates the physical book fold,
     always visible regardless of flip animation state */
  /* Hardening for St.PageFlip's internal DOM (prevents underlying pages
     from bleeding through / appearing to lift during the flip animation).
     Only .stf__item (the actual leaf page wrapper) gets a solid fill —
     the outer wrapper levels stay transparent so an unused page slot in
     single-cover mode shows the dark stage backdrop instead of a blank
     white rectangle. */
  #book .stf__parent,
  #book .stf__wrapper,
  #book .stf__block{
    background-color:transparent !important;
    overflow:hidden !important;
    backface-visibility:hidden !important;
    -webkit-backface-visibility:hidden !important;
  }
  #book .stf__item{
    background-color:#ffffff !important;
    overflow:hidden !important;
    backface-visibility:hidden !important;
    -webkit-backface-visibility:hidden !important;
  }
  .page{
    background-color:#ffffff;
    overflow:hidden;
    position:relative;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    transform-style:preserve-3d;
    isolation:isolate;
    padding:0;
    margin:0;
  }
  .page-content{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background-color:#ffffff;
    position:relative;
    overflow:hidden;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    padding:0;
    margin:0;
  }
  /* Inner spine shadow — darkens the inner edge of every page so the
     center fold reads clearly in any two-page spread, and travels with
     the page itself during the flip animation (unlike a static overlay) */
  .page-content::before{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(to right, rgba(0,0,0,.16) 0%, rgba(0,0,0,0) 9%),
      linear-gradient(to left, rgba(0,0,0,.16) 0%, rgba(0,0,0,0) 9%);
    pointer-events:none;
    z-index:6;
  }
  /* Directional spine shadow for spreads where the page's side is known
     (--left = spine on its right edge, --right = spine on its left edge) */
  .page.--left .page-content::before{
    background:linear-gradient(to left, rgba(0,0,0,.18) 0%, rgba(0,0,0,0) 16%);
  }
  .page.--right .page-content::before{
    background:linear-gradient(to right, rgba(0,0,0,.18) 0%, rgba(0,0,0,0) 16%);
  }
  .page-content img{
    width:100%; height:100%;
    object-fit:contain;
    object-position:center;
    display:block;
    background-color:#ffffff;
    padding:0;
    margin:0 auto;
  }
  .page-number{
    position:absolute;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    font-size:12px;
    color:#555;
    font-family:inherit;
    z-index:8;
    pointer-events:none;
    background-color:rgba(255,255,255,.75);
    padding:1px 8px;
    border-radius:3px;
  }

  #controls{
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    justify-content:center;
    padding:6px 10px;
  }
  .ctrl-btn{
    background:var(--panel-dark);
    border:1px solid #33373f;
    color:#eee;
    padding:9px 18px;
    border-radius:24px;
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    transition:background .15s, transform .1s;
    user-select:none;
  }
  .ctrl-btn:hover{background:#25292f;}
  .ctrl-btn:active{transform:scale(.96);}
  .ctrl-btn.disabled{opacity:.35; pointer-events:none;}
  #page-indicator{
    font-size:13px;
    color:#ccc;
    background:var(--panel-dark);
    border:1px solid #33373f;
    padding:9px 16px;
    border-radius:24px;
    min-width:120px;
    text-align:center;
  }
  #fullscreen-btn{
    margin-left:6px;
  }
  .hint{
    font-size:11px;
    color:#777;
    text-align:center;
  }

  @media (max-width: 700px){
    #stage{padding:10px; gap:10px;}
    #title-bar{font-size:10.5px; letter-spacing:1.2px;}
    #book-wrap{padding:14px 10px; max-width:100%;}
    #book, #bookshadow{
      /* On narrow screens the book shows a single page (usePortrait:true
         kicks in), so size the container to a single-page ratio (1:1.41)
         instead of the wider two-page spread ratio used on desktop. */
      width:min(88vw, calc(64vh / 1.41));
      height:min(64vh, calc(88vw * 1.41));
      max-width:420px;
    }
    #controls{gap:8px; padding:4px 4px;}
    .ctrl-btn{padding:8px 12px; font-size:11.5px; gap:4px;}
    #page-indicator{padding:8px 12px; font-size:11.5px; min-width:88px;}
    #fullscreen-btn{margin-left:0;}
    .hint{font-size:9.5px; padding:0 8px;}
    .page-number{font-size:10px; bottom:10px; padding:1px 6px;}
  }

  @media (max-width: 420px){
    #title-bar{font-size:9px; letter-spacing:.8px;}
    .ctrl-btn{padding:7px 10px; font-size:11px;}
    #page-indicator{padding:7px 10px; font-size:11px; min-width:76px;}
    .hint{display:none;}
  }

  @media (max-width: 700px) and (orientation: landscape){
    /* Phones held sideways have plenty of width but very little height —
       let the book use more of the vertical space and shrink the chrome. */
    #stage{padding:6px; gap:6px;}
    #title-bar{font-size:9px;}
    #book-wrap{padding:8px 10px;}
    #book, #bookshadow{
      width:min(70vw, calc(80vh / 1.41));
      height:min(80vh, calc(70vw * 1.41));
      max-width:360px;
    }
    .hint{display:none;}
  }

  /* ==== Print feature (additive only — does not affect the flipbook) ==== */
  #printArea{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #stage{ display:none !important; }
    #printArea{
      display:block !important;
      position:absolute;
      top:0; left:0;
      width:100%;
      background:#fff;
    }
    #printArea .print-page{
      width:100%;
      page-break-after:always;
      break-after:page;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    #printArea .print-page:last-child{
      page-break-after:auto;
      break-after:auto;
    }
    #printArea .print-page img{
      width:100%;
      height:auto;
      max-height:100vh;
      object-fit:contain;
      display:block;
    }
    @page{
      size:auto;
      margin:10mm;
    }
  }
</style>
</head>

  <div id="title-bar">Achievement Lock &middot; Denny's Bunch &middot; Interactive Flipbook</div>

  <div id="book-wrap">
    <div id="bookshadow"></div>
    <div id="book"></div>
  </div>

  <div id="controls">
    <button class="ctrl-btn" id="btnPrev">&#8592; Sebelumnya</button>
    <div id="page-indicator">Halaman 1 / 26</div>
    <button class="ctrl-btn" id="btnNext">Selanjutnya &#8594;</button>
    <button class="ctrl-btn" id="fullscreen-btn">&#9974; Layar Penuh</button>
    <button class="ctrl-btn" id="print-btn">&#128424; Cetak / Print</button>
  </div>
  <div class="hint">Gunakan tombol panah keyboard (&#8592; &#8594;) atau seret sudut halaman untuk membalik</div>
</div>

<script>
(function(){
  const TOTAL_PAGES = 25;
  const bookEl = document.getElementById('book');
  const indicator = document.getElementById('page-indicator');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const fsBtn = document.getElementById('fullscreen-btn');

  // Build page DOM elements — showCover:true handles the front/back
  // cover pairing automatically, so no manual blank page is added.
  // Page numbering rules:
  //  - Page 1 (front cover) & Page 2 (grayscale cover) & Page 25 (back cover): no number
  //  - Page 3 (title/module page): Roman numeral "II"
  //  - Page 4 onward: sequential Arabic numbers 1, 2, 3, ... (resets after the Roman page)
  function getPageNumberLabel(i){
    if(i === 1 || i === 2 || i === 25) return '';
    if(i === 3) return 'II';
    return String(i - 3); // page 4 -> "1", page 5 -> "2", ...
  }

  for(let i=1;i<=25;i++){
    const pageDiv = document.createElement('div');
    pageDiv.className = 'page';
    const numLabel = getPageNumberLabel(i);
    const numHTML = numLabel ? `<div class="page-number">${numLabel}</div>` : '';
    pageDiv.innerHTML = `<div class="page-content"><img src="${PAGE_DATA[i]}" alt="Halaman ${i}">${numHTML}</div>`;
    bookEl.appendChild(pageDiv);
  }

  let pageFlip;
  let usingFallback = false;

  function updateIndicator(current){
    indicator.textContent = `Halaman ${current} / ${TOTAL_PAGES}`;
  }

  function initFlipbook(){
    if(typeof St === 'undefined' || !St.PageFlip){
      usingFallback = true;
      initFallback();
      return;
    }
    try{
      // Cap the book's height to ~68% of the browser's viewport height,
      // matching the #book/#bookshadow CSS (max-height:68vh) so the
      // footer controls always stay clear of the book.
      const cappedMaxHeight = Math.round(window.innerHeight * 0.68);

      // Derive single-page width from height using the A4/book-standard
      // ratio of 1 : 1.41 (height : width), instead of a fixed guess,
      // so the page always reads as a tall, slender portrait sheet —
      // never a wide/flattened rectangle.
      const pageHeight = 500;
      const pageWidth = Math.round(pageHeight / 1.41);
      const PAGE_MAX_WIDTH = 480; // single-page cap, keeps a 2-page spread from ever eating the whole screen

      pageFlip = new St.PageFlip(bookEl, {
        width: pageWidth,
        height: pageHeight,
        size: "stretch",
        minWidth: 220,
        maxWidth: PAGE_MAX_WIDTH,
        minHeight: 310,
        maxHeight: cappedMaxHeight,
        autoSize: true,
        drawShadow: true,
        maxShadowOpacity: 0.6,
        showCover: true,
        mobileScrollSupport: false,
        usePortrait: true,
        flippingTime: 700
      });
      pageFlip.loadFromHTML(document.querySelectorAll('#book .page'));

      pageFlip.on('flip', (e)=>{
        updateIndicator(e.data + 1);
        refreshButtons();
      });

      updateIndicator(1);
      refreshButtons();

      btnPrev.addEventListener('click', ()=> pageFlip.flipPrev());
      btnNext.addEventListener('click', ()=> pageFlip.flipNext());
    }catch(err){
      console.error('PageFlip init failed, using fallback viewer:', err);
      usingFallback = true;
      initFallback();
    }
  }

  function refreshButtons(){
    if(usingFallback || !pageFlip) return;
    const current = pageFlip.getCurrentPageIndex();
    const count = pageFlip.getPageCount();
    btnPrev.classList.toggle('disabled', current <= 0);
    btnNext.classList.toggle('disabled', current >= count - 1);
  }

  // Fallback: simple two-page spread slider if CDN library fails to load
  // (mirrors showCover behavior: page 1 and page 25 render alone)
  let fallbackIndex = 0; // 0 = front cover, then spreads, last = back cover
  function initFallback(){
    bookEl.innerHTML = '';
    bookEl.style.display = 'flex';
    const left = document.createElement('div');
    left.className = 'page --left';
    left.style.flex = '1';
    const right = document.createElement('div');
    right.className = 'page --right';
    right.style.flex = '1';
    bookEl.appendChild(left);
    bookEl.appendChild(right);

    function pageHTML(n){
      if(!n || n < 1 || n > 25) return '';
      return `<div class="page-content"><img src="${PAGE_DATA[n]}" alt="Halaman ${n}"></div>`;
    }

    // Build the same cover-aware pairing showCover:true produces:
    // [1] alone | [2,3] | [4,5] | ... | [22,23] | [24] alone | [25] alone
    const spreads = [[1]];
    let n = 2;
    while(n <= 23){
      spreads.push([n, n+1]);
      n += 2;
    }
    if(n === 24) spreads.push([24]); // odd page count leaves one page alone
    spreads.push([25]);

    function render(){
      const spread = spreads[fallbackIndex] || [1];
      const [l, r] = spread;
      left.innerHTML = pageHTML(l);
      left.style.visibility = l ? 'visible' : 'hidden';
      right.innerHTML = pageHTML(r);
      right.style.visibility = r ? 'visible' : 'hidden';
      updateIndicator(l || r || 1);
      btnPrev.classList.toggle('disabled', fallbackIndex <= 0);
      btnNext.classList.toggle('disabled', fallbackIndex >= spreads.length - 1);
    }
    render();

    btnPrev.addEventListener('click', ()=>{
      if(fallbackIndex > 0){ fallbackIndex--; render(); }
    });
    btnNext.addEventListener('click', ()=>{
      if(fallbackIndex < spreads.length - 1){ fallbackIndex++; render(); }
    });
  }

  // Keyboard navigation
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowLeft'){ btnPrev.click(); }
    else if(e.key === 'ArrowRight'){ btnNext.click(); }
  });

  // Fullscreen toggle
  fsBtn.addEventListener('click', ()=>{
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
      fsBtn.innerHTML = '&#10005; Keluar Layar Penuh';
    } else {
      document.exitFullscreen().catch(()=>{});
      fsBtn.innerHTML = '&#9974; Layar Penuh';
    }
  });
  document.addEventListener('fullscreenchange', ()=>{
    if(!document.fullscreenElement){
      fsBtn.innerHTML = '&#9974; Layar Penuh';
    }
  });

  // Give the CDN a moment to load before initializing
  window.addEventListener('load', ()=>{
    setTimeout(initFlipbook, 150);
  });
})();
</script>

<script>
// ==== Print feature (standalone, additive only) ====
// Builds a plain, ordered, one-page-per-sheet printable document from the
// same PAGE_DATA already loaded for the flipbook, then triggers the
// browser's print dialog. Does not touch or depend on the flipbook logic.
(function(){
  function buildPrintArea(){
    const area = document.getElementById('printArea');
    if(!area || area.childElementCount > 0) return; // already built
    for(let i=1;i<=25;i++){
      const sheet = document.createElement('div');
      sheet.className = 'print-page';
      sheet.innerHTML = `<img src="${PAGE_DATA[i]}" alt="Halaman ${i}">`;
      area.appendChild(sheet);
    }
  }

  const printBtn = document.getElementById('print-btn');
  if(printBtn){
    printBtn.addEventListener('click', ()=>{
      buildPrintArea();
      window.print();
    });
  }
})();
</script>
